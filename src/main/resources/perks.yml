dash:
  name: "Dash"
  tier: SILVER
  team: BOTH
  icon: FEATHER
  description:
    - "Right-click Feather to dash forward"
    - "5 second cooldown"
  hooks:
    apply:
      - actions: &dash_apply
          - type: give_item
            material: FEATHER
            amount: 1
            display_name: "&bDash&7 (Right-Click)"
            lore:
              - "&7Dash forward"
              - "&eCooldown: 5s"
    on_tick:
      - conditions:
          - type: item_count_below
            material: FEATHER
            threshold: 1
        actions: *dash_apply
    on_interact:
      - conditions:
          - type: is_right_click
          - type: item_in_hand
            material: FEATHER
            name_contains: "Dash"
          - type: cooldown
            ms: 5000
        actions:
