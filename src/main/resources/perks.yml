# Data-driven perk definitions. Each top-level key is a unique perk id.
#
# Schema:
#   name        — display name (string)
#   tier        — SILVER | GOLD | PRISMATIC
#   team        — HUMAN | VAMPIRE | BOTH
#   icon        — Bukkit Material name (used for GUI icons)
#   description — list of lore strings
#   attributes: [optional]               shortcut: each entry expands into
#     - key:        "vampirez:foo"       APPLY: add modifier  +  REMOVE: remove modifier
#       attribute:  MAX_HEALTH | ATTACK_SPEED | ATTACK_DAMAGE | MOVEMENT_SPEED | ARMOR | ...
#       operation:  ADD_NUMBER | ADD_SCALAR | MULTIPLY_SCALAR_1
#       value:      <double>
#       slot_group: any | mainhand | armor | ...   (default: any)
#   hooks:
#     <hook_name>:                       e.g. on_damage_dealt, on_damage_taken
#       - conditions: [optional list]    all must pass for actions to run
#         actions: [list]                executed in order
#
# Available hooks: apply, remove, on_damage_dealt, on_damage_taken,
#                  on_kill, on_death, on_tick, on_health_regain,
#                  on_interact, on_respawn
#
# Available conditions: victim_is_player, from_behind, is_sprinting, is_sneaking,
#                       hp_below_percent, hp_below_absolute, cooldown,
#                       ally_within_range (radius),
#                       is_right_click,
#                       item_count_below (material, threshold),
#                       item_in_hand (material, name_contains)
#
# Available actions: multiply_damage, set_damage, add_damage,
#                    add_attribute_modifier, remove_attribute_modifier,
#                    add_enchant (target via material | material_contains | slot:armor),
#                    apply_potion (target: victim/attacker/owner; effect, duration_ticks, amplifier,
#                                  ambient, particles, stack_duration),
#                    apply_potion_aura (radius, allies_only, include_self; effect, duration_ticks,
#                                       amplifier, ambient, particles) — applies to nearby players,
#                    aoe_heal (radius, allies_only, include_self, amount) — heal nearby players,
#                    play_sound (sound, volume, pitch; target: attacker by default),
#                    spawn_particle (particle, count, offset_y, spread_x/y/z, extra,
#                                    dust_color "r,g,b", dust_size, block; target: victim by default),
#                    set_fire (duration_ticks; target: victim by default),
#                    spawn_mob (entity_type, count, lifetime_ticks, custom_name, name_color,
#                               team, no_baby, angry, tamed, equipment_main_hand,
#                               equipment_helmet, spread_x),
#                    give_item (material, amount, display_name, lore [list],
#                               enchantments [list of {name, level}], potion_type),
#                    dash (magnitude, lift),
#                    cancel_event

blunt_force:
  name: "Blunt Force"
  tier: SILVER
  team: BOTH
  icon: IRON_INGOT
  description:
    - "+20% melee damage"
  hooks:
    on_damage_dealt:
      - actions:
          - type: multiply_damage
            factor: 1.2

tough_skin:
  name: "Tough Skin"
  tier: SILVER
  team: BOTH
  icon: IRON_INGOT
  description:
    - "-10% damage taken"
  hooks:
    on_damage_taken:
      - actions:
          - type: multiply_damage
            factor: 0.9

backstab:
  name: "Backstab"
  tier: SILVER
  team: VAMPIRE
  icon: IRON_SWORD
